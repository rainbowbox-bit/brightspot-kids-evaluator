<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>看見孩子身上的星星 — 評語生成器</title>
  <meta name="description" content="幼教老師總結性評語 AI 生成工具，支援 Gemini AI 與離線模板雙模式。" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://unpkg.com/lucide-react@0.378.0/dist/umd/lucide-react.js"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.4s ease-out; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
    .animate-toast { animation: toastIn 0.3s ease-out; }
  </style>
</head>
<body class="bg-stone-50">
  <div id="root"></div>
  <noscript><div style="padding:2rem;text-align:center;color:#78716c;">此應用需要啟用 JavaScript 才能執行。</div></noscript>
  <script type="text/babel">
    const App = () => (
      <div className="min-h-screen flex items-center justify-center">
        <p className="text-stone-400 text-lg">載入中...</p>
      </div>
    );
    const rootEl = document.getElementById('root');
    if (rootEl) {
      ReactDOM.createRoot(rootEl).render(<App />);
    }
  </script>
</body>
</html>
